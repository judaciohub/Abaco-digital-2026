<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem de Não Conformidades</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <button class="finalizar-btn" id="btn-finalizar">Finalizar Contagem</button>
        <div class="top-section" id="top-section"></div>
        <div class="main-grid" id="main-grid"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Resumo da Contagem</div>
            <div id="modal-body"></div>
            <div class="responsavel-group">
                <label for="responsavel">Nome do Responsável:</label>
                <input type="text" id="responsavel">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-close" id="btn-close">Fechar</button>
                <button class="modal-btn btn-reset" id="btn-reset">Resetar Tudo</button>
                <button class="modal-btn btn-pdf" id="btn-pdf">Gerar Relatório</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
